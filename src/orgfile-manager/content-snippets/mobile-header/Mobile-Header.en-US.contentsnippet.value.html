<a href='~/' class='au-header__brand' title='{{ snippets['Site name'] | default: "Veylo" }}'>
  {%- if snippets['Logo URL'] %}<img src='{{ snippets['Logo URL'] }}' alt='{{ snippets['Logo alt text'] | default: "Veylo" }}' class='au-header__logo' style='width: auto; height: 38px; margin-right: 12px; vertical-align: middle;'>{% endif %}
  {% if snippets['Site name'] -%}
    <span class='siteTitle'>{{ snippets['Site name'] }}</span>
  {%- endif %}
</a>
