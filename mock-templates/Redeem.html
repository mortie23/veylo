<div id="content-container" class="container wrapper-body" role="main">
    <div id="content">
        <ul class="nav nav-tabs nav-account" role="tablist" onkeydown="navigation(event)">
            <li role="none" class=""><a role="tab" aria-selected="false" href="/SignIn?returnUrl=%2F"
                    aria-label="Sign in" tabindex="-1" title="Sign in"><span class="fa fa-sign-in"
                        aria-hidden="true"></span> Sign in</a></li>
            <li role="none" class="">
                <a role="tab" aria-selected="false" href="/Account/Login/Register?returnUrl=%2F" aria-label="Register"
                    title="Register" tabindex="-1">Register</a>
            </li>
            <li role="none" class="active"><a role="tab" href="javascript:void(0)" aria-label="Redeem invitation"
                    title="Redeem invitation">Redeem invitation</a></li>
        </ul>
        <script type="text/javascript" nonce="">
            const keyCodes = {
                END: 35,
                HOME: 36,
                LEFT: 37,
                RIGHT: 39,
                SPACE: 32
            };
            $(document).ready(function () {
                //make the tabindex='0' for active tab and -1 for others
                $(".nav.nav-tabs.nav-account > li > a").attr("tabindex", "-1");
                $(".nav.nav-tabs.nav-account > li > a").attr("aria-selected", "false");
                $(".nav.nav-tabs.nav-account > li.active > a").attr("tabindex", "0");
                $(".nav.nav-tabs.nav-account > li.active > a").trigger("focus");
                $(".nav.nav-tabs.nav-account > li.active > a").attr("aria-selected", "true");
            });
            function navigation(e) {
                //change tabindex dynamically for all the tabs on key press of left-right navigation keys or home/end keys
                var tabs = $(".nav.nav-tabs.nav-account > li > a");
                if (e.keyCode === keyCodes.END || e.keyCode === keyCodes.HOME || e.keyCode === keyCodes.LEFT || e.keyCode === keyCodes.RIGHT) {
                    var currentTab = $(document.activeElement);
                    for (index = 0; index < tabs.length; index++) {
                        if ($(tabs[index]).text() === currentTab.text()) {
                            e.keyCode === keyCodes.LEFT || e.keyCode === keyCodes.END ? (index == 0 || e.keyCode === keyCodes.END ? $(tabs[tabs.length - 1]).trigger("focus") :
                                $(tabs[index - 1]).trigger("focus")) : (index == (tabs.length - 1) || e.keyCode === keyCodes.HOME ? $(tabs[0]).focus() : $(tabs[index + 1]).trigger("focus"));
                        }
                    }
                }
                //open tab on click of SPACE key
                if (e.keyCode == keyCodes.SPACE) {
                    e.preventDefault();
                    $(document.activeElement)[0].click();
                    tabs.attr("tabindex", "-1").attr("aria-selected", "false");
                }
            }
        </script>

            </div>

                <div class="form-horizontal">

                                id="InvitationCode" name="InvitationCode" title="Invitation code is a required field."

                                        name="RedeemByLogin" type="hidden" value="false">

                                            class="xrm-attribute-value-encoded xrm-attribute-value">I have an existing
                                            account</span></span>

                                class="btn btn-primary">Register</button>

            <script type="text/javascript" nonce="">
                $(function () {
